name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest
    # Placeholders: el build no se conecta a servicios externos; los valores reales
    # viven en las Environment Variables de Vercel por entorno (§8.4).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-jwt-secret' }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci-admin-secret' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  evaluate:
    name: Evaluación (golden set)
    runs-on: ubuntu-latest
    needs: check
    # Puerta de promoción (§5.3.3 / §8.2): ningún cambio se promueve si la
    # evaluación cae por debajo de los umbrales. Corre en PRs hacia main/develop.
    if: ${{ github.event_name == 'pull_request' }}
    env:
      APP_ENV: staging
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' && 'true' || 'false' }}
      LANGSMITH_PROJECT: dtecnoc-stg
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Golden set (falla si no supera umbrales §5.2)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: npm run eval

      - name: Aviso si no hay GROQ_API_KEY
        if: ${{ env.GROQ_API_KEY == '' }}
        run: echo "::warning::Se omite la evaluación — configura el secret GROQ_API_KEY para activar la puerta de calidad."
